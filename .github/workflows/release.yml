name: Release

# Push a tag like v0.2.0 to build images for every architecture
# and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      # Static binaries + docker-archive images for amd64, arm64, armv7
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VartaDNS $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar dist/vartadns-linux-* dist/SHA256SUMS
